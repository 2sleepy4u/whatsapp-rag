[project]
name = "chat-rag"
version = "0.1.0"
description = "Local RAG + analytics over exported WhatsApp chats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "emoji>=2.10",
    "pydantic>=2.7",
    "chromadb>=1.5.9",
    "ollama>=0.6.2",
    "scikit-learn>=1.9.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
chat-rag = "chat_rag.cli:app"

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_rag"]
